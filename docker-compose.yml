services:
  mysql:
    image: mysql:8.4
    container_name: optout-lms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: optout_lms_db
      MYSQL_USER: lms_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-LmsSecretPass2026!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootSecretPass2026!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optout-lms-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: optout_lms_db
      DB_USER: lms_app
      DB_PASSWORD: ${DB_PASSWORD:-LmsSecretPass2026!}
      JWT_SECRET: ${JWT_SECRET:-c2VjdXJlX2xvbmdfcmFuZG9tX2tleV9mb3Jfb3B0b3V0X2xtc18yMDI2X3VuaXZlcnNpdHlfcGxhdGZvcm1fc2VjcmV0IQ==}
      CLIENT_BASE_URL: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dummy-key-dev}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: optout-lms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
