spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:optout_lms_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:lms_app}
    password: ${DB_PASSWORD:LmsSecretPass2026!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlX2xvbmdfcmFuZG9tX2tleV9mb3Jfb3B0b3V0X2xtc18yMDI2X3VuaXZlcnNpdHlfcGxhdGZvcm1fc2VjcmV0IQ==}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${CLIENT_BASE_URL:http://localhost:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:dummy-key-dev}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
